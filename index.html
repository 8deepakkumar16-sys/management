<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Time Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
        body{background:linear-gradient(-45deg,#667eea 0%,#764ba2 50%,#f093fb 100%);background-size:400% 400%;animation:gradientShift 12s ease infinite;min-height:100vh;color:#333;overflow-x:hidden}
        @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .container{max-width:1200px;margin:0 auto;padding:20px;min-height:100vh}
        .header{text-align:center;color:#fff;margin-bottom:30px;animation:fadeInDown 1s ease-out}
        @keyframes fadeInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
        .header h1{font-size:2.8rem;margin-bottom:5px;text-shadow:0 5px 20px rgba(0,0,0,.3)}
        .header p{font-size:1.1rem;opacity:.9}
        .dashboard{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border-radius:25px;border:1px solid rgba(255,255,255,.2);padding:30px;box-shadow:0 20px 40px rgba(0,0,0,.1);animation:fadeInUp 1s ease-out .2s both}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .time-card{background:rgba(255,255,255,.2);border-radius:20px;padding:25px;text-align:center;margin-bottom:25px;color:#fff}
        .time{font-size:2.5rem;font-weight:300;margin-bottom:5px;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .date{font-size:1rem;opacity:.9}
        .add-btn{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);color:#fff;border:none;padding:16px 30px;font-size:1.1rem;border-radius:50px;cursor:pointer;width:100%;margin-bottom:25px;font-weight:500;transition:all .3s ease;box-shadow:0 10px 30px rgba(79,172,254,.4)}
        .add-btn:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(79,172,254,.6)}
        .categories{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap;justify-content:center}
        .category{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:12px 20px;border-radius:25px;cursor:pointer;font-weight:500;transition:all .3s ease;display:flex;align-items:center;gap:8px}
        .category.active,.category:hover{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,.4)}
        .tasks-list{min-height:350px;margin-bottom:25px}
        .task{background:rgba(255,255,255,.1);border-radius:15px;padding:20px;margin-bottom:15px;border:1px solid rgba(255,255,255,.2);transition:all .3s ease;cursor:pointer}
        .task:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(0,0,0,.2)}
        .task.completed{opacity:.7;background:rgba(46,125,50,.2)}
        .task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:10px}
        .task-title{font-size:1.2rem;font-weight:600;color:#fff;flex:1}
        .badge{padding:5px 12px;border-radius:15px;font-size:.8rem;font-weight:600}
        .badge-study{background:rgba(33,150,243,.3);color:#2196f3}
        .badge-exercise{background:rgba(76,175,80,.3);color:#4caf50}
        .badge-personal{background:rgba(244,67,54,.3);color:#f44336}
        .task-meta{color:rgba(255,255,255,.8);font-size:.9rem;margin-bottom:15px}
        .task-actions{display:flex;gap:8px;flex-wrap:wrap}
        .btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:500;font-size:.85rem;transition:all .3s ease;flex:1;min-width:70px}
        .btn-success{background:#4caf50;color:#fff}
        .btn-warning{background:#ff9800;color:#fff}
        .btn-danger{background:#f44336;color:#fff}
        .btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.3)}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-top:20px}
        .stat{background:rgba(255,255,255,.15);border-radius:15px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,.2);transition:all .3s ease}
        .stat:hover{transform:translateY(-5px)}
        .stat-number{font-size:2rem;font-weight:300;color:#fff;margin-bottom:5px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:1000;align-items:center;justify-content:center;padding:20px}
        .modal.active{display:flex}
        .modal-content{background:#fff;border-radius:20px;width:100%;max-width:450px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:modalSlide 0.3s ease-out}
        @keyframes modalSlide{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-header{padding:25px 25px 15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
        .modal-title{font-size:1.3rem;font-weight:600;color:#333}
        .close-btn{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#999;padding:5px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .close-btn:hover{background:#f0f0f0;color:#666}
        .form-group{padding:0 25px;margin-bottom:20px}
        .form-group label{display:block;margin-bottom:8px;font-weight:500;color:#555}
        .form-group input,.form-group select{width:100%;padding:14px;border:2px solid #e8e8e8;border-radius:10px;font-size:1rem;transition:border-color .3s}
        .form-group input:focus{outline:none;border-color:#667eea}
        .form-actions{padding:20px 25px 25px;display:flex;gap:12px;justify-content:flex-end;border-top:1px solid #eee}
        .btn-cancel{background:#f5f5f5;color:#666;padding:12px 24px;border:none;border-radius:10px;cursor:pointer;font-weight:500}
        .btn-save{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:12px 24px;border:none;border-radius:10px;cursor:pointer;font-weight:500}
        .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.95)}
        .empty-state i{font-size:4rem;margin-bottom:20px;opacity:.8}
        .empty-state h2{font-size:1.4rem;margin-bottom:10px}
        @media(max-width:768px){.header h1{font-size:2rem}.time{font-size:2rem}.categories{flex-direction:column;align-items:center}.task-actions{flex-direction:column}.btn{width:100%}}
    </style>
</head>
<body>
<div class="container">
<header class="header">
<h1><i class="fas fa-graduation-cap"></i> Student Time Manager</h1>
<p>Plan. Track. Succeed. ✨</p>
</header>

<div class="dashboard">
<div class="time-card">
<div class="time" id="clock">12:00</div>
<div class="date" id="date">Loading...</div>
</div>

<button class="add-btn" onclick="app.openModal()">
<i class="fas fa-plus"></i> Add New Task
</button>

<div class="categories">
<button class="category active" data-cat="all" onclick="app.filter('all')">
<i class="fas fa-list"></i> All <span id="count-all">0</span>
</button>
<button class="category" data-cat="study" onclick="app.filter('study')">
<i class="fas fa-book"></i> Study <span id="count-study">0</span>
</button>
<button class="category" data-cat="exercise" onclick="app.filter('exercise')">
<i class="fas fa-dumbbell"></i> Exercise <span id="count-exercise">0</span>
</button>
<button class="category" data-cat="personal" onclick="app.filter('personal')">
<i class="fas fa-heart"></i> Personal <span id="count-personal">0</span>
</button>
</div>

<div class="tasks-list" id="tasks-container">
<div class="empty-state">
<i class="fas fa-rocket"></i>
<h2>Ready to Start!</h2>
<p>Click "Add New Task" to begin organizing your day</p>
</div>
</div>

<div class="stats">
<div class="stat">
<div class="stat-number" id="total-tasks">0</div>
Total Tasks
</div>
<div class="stat">
<div class="stat-number" id="done-tasks">0</div>
Completed
</div>
<div class="stat">
<div class="stat-number" id="progress">0%</div>
Progress
</div>
</div>
</div>
</div>

<!-- Modal -->
<div class="modal" id="task-modal">
<div class="modal-content">
<div class="modal-header">
<h3 class="modal-title" id="modal-title">Add New Task</h3>
<button class="close-btn" onclick="app.closeModal()">&times;</button>
</div>
<form id="task-form">
<div class="form-group">
<label>Task Name</label>
<input type="text" id="task-name" placeholder="e.g. Math homework, Gym session" required>
</div>
<div class="form-group">
<label>Duration (minutes)</label>
<input type="number" id="task-duration" min="5" max="720" value="45" required>
</div>
<div class="form-group">
<label>Date</label>
<input type="date" id="task-date" required>
</div>
<div class="form-group">
<label>Category</label>
<select id="task-category" required>
<option value="study">📚 Study</option>
<option value="exercise">💪 Exercise</option>
<option value="personal">❤️ Personal</option>
</select>
</div>
<div class="form-group">
<label style="display:flex;align-items:center;gap:8px;cursor:pointer">
<input type="checkbox" id="task-done">
<span>Mark as completed</span>
</label>
</div>
<div class="form-actions">
<button type="button" class="btn-cancel" onclick="app.closeModal()">Cancel</button>
<button type="submit" class="btn-save">Save Task</button>
</div>
</form>
</div>
</div>

<script>
class StudentTimeManager{
constructor(){
this.tasks=JSON.parse(localStorage.getItem('student-tasks'))||[];
this.currentFilter='all';
this.editingId=null;
this.init();
}
init(){
this.updateClock();
this.setTodayDate();
this.render();
this.bindEvents();
setInterval(()=>this.updateClock(),1e3);
}
updateClock(){
const now=new Date();
document.getElementById('clock').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
}
setTodayDate(){
const today=new Date().toISOString().split('T')[0];
document.getElementById('task-date').value=today;
}
bindEvents(){
document.getElementById('task-form').onsubmit=e=>{e.preventDefault();this.saveTask();};
document.querySelectorAll('.category').forEach(btn=>{
btn.onclick=()=>this.filter(btn.dataset.cat);
});
}
filter(category){
this.currentFilter=category;
document.querySelectorAll('.category').forEach(btn=>btn.classList.remove('active'));
document.querySelector(`[data-cat="${category}"]`).classList.add('active');
this.render();
}
openModal(task=null){
const modal=document.getElementById('task-modal');
this.setTodayDate();
if(task){
this.editingId=task.id;
document.getElementById('modal-title').textContent='Edit Task';
document.getElementById('task-name').value=task.name;
document.getElementById('task-duration').value=task.duration;
document.getElementById('task-date').value=task.date;
document.getElementById('task-category').value=task.category;
document.getElementById('task-done').checked=task.completed;
}else{
this.editingId=null;
document.getElementById('modal-title').textContent='Add New Task';
document.getElementById('task-form').reset();
this.setTodayDate();
}
modal.classList.add('active');
}
closeModal(){
document.getElementById('task-modal').classList.remove('active');
}
saveTask(){
const name=document.getElementById('task-name').value.trim();
if(!name)return alert('Please enter task name');
const task={
id:this.editingId||Date.now().toString(),
name:name,
duration:parseInt(document.getElementById('task-duration').value),
date:document.getElementById('task-date').value,
category:document.getElementById('task-category').value,
completed:document.getElementById('task-done').checked
};
if(this.editingId){
const index=this.tasks.findIndex(t=>t.id===this.editingId);
this.tasks[index]=task;
}else{
this.tasks.unshift(task);
}
localStorage.setItem('student-tasks',JSON.stringify(this.tasks));
this.render();
this.closeModal();
}
deleteTask(id){
if(confirm('Delete this task?')){
this.tasks=this.tasks.filter(t=>t.id!==id);
localStorage.setItem('student-tasks',JSON.stringify(this.tasks));
this.render();
}
}
toggleTask(id){
const task=this.tasks.find(t=>t.id===id);
if(task){
task.completed=!task.completed;
localStorage.setItem('student-tasks',JSON.stringify(this.tasks));
this.render();
}
}
render(){
const container=document.getElementById('tasks-container');
let tasks=this.tasks;
if(this.currentFilter!=='all'){
tasks=tasks.filter(t=>t.category===this.currentFilter);
}
if(tasks.length===0){
container.innerHTML=`
<div class="empty-state">
<i class="fas fa-${this.currentFilter==='all'?'clipboard-list':'book-open'}"></i>
<h2>No ${this.currentFilter} tasks</h2>
<p>Add your first ${this.currentFilter} task!</p>
</div>`;
return;
}
container.innerHTML=tasks.map(task=>`
<div class="task ${task.completed?'completed':''}">
<div class="task-header">
<div class="task-title">${this.escapeHtml(task.name)}</div>
<span class="badge badge-${task.category}">${this.getCategoryName(task.category)}</span>
</div>
<div class="task-meta">
⏱️ ${task.duration}min • 📅 ${new Date(task.date).toLocaleDateString()}
${task.completed?' • ✅ Done':''}
</div>
<div class="task-actions">
<button class="btn btn-success" onclick="app.toggleTask('${task.id}')">
${task.completed?'↩️ Undo':'✅ Complete'}
</button>
<button class="btn btn-warning" onclick="app.openModal(${JSON.stringify(task)})">✏️ Edit</button>
<button class="btn btn-danger" onclick="app.deleteTask('${task.id}')">🗑️ Delete</button>
</div>
</div>
`).join('');
this.updateStats();
}
updateStats(){
const total=this.tasks.length;
const done=this.tasks.filter(t=>t.completed).length;
const progress=total>0?Math.round(done/total*100):0;
document.getElementById('total-tasks').textContent=total;
document.getElementById('done-tasks').textContent=done;
document.getElementById('progress').textContent=progress+'%';
const counts={all:total,study:0,exercise:0,personal:0};
this.tasks.forEach(t=>{
if(t.category==='study')counts.study++;
if(t.category==='exercise')counts.exercise++;
if(t.category==='personal')counts.personal++;
});
Object.keys(counts).forEach(key=>{
const el=document.getElementById(`count-${key}`);
if(el)el.textContent=counts[key];
});
}
getCategoryName(cat){return{study:'Study',exercise:'Exercise',personal:'Personal'}[cat]||cat}
escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML}
}

const app=new StudentTimeManager();
</script>
</body>
</html>
