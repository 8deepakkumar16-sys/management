<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Time Manager - Perfect Daily Schedule</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: floatParticles 20s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes floatParticles {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideInDown 1s ease-out;
        }

        @keyframes slideInDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glowText 2s ease-in-out infinite alternate;
        }

        @keyframes glowText {
            from { filter: drop-shadow(0 0 10px #fff); }
            to { filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 30px #667eea); }
        }

        .dashboard {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            padding: 40px;
            animation: slideInUp 1s ease-out 0.3s both;
        }

        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .date-time-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 35px;
            animation: pulseGlow 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,255,255,0.6); }
        }

        .current-time {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 8px;
            animation: timeTick 1s ease-in-out infinite;
        }

        @keyframes timeTick {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .add-task-btn {
            background: var(--success-gradient);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.2rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(79,172,254,0.4);
            display: block;
            margin: 0 auto 35px;
        }

        .add-task-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 25px 50px rgba(79,172,254,0.6);
        }

        .task-categories {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            color: white;
            animation: slideInLeft 0.6s ease-out forwards;
            opacity: 0;
        }

        .category.active {
            background: var(--primary-gradient);
            transform: scale(1.1);
        }

        .category:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .tasks-list {
            min-height: 400px;
            margin-bottom: 40px;
        }

        .task-item {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .task-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .task-item.completed {
            background: rgba(76,175,80,0.15);
            border-color: rgba(76,175,80,0.4);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .task-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
        }

        .task-category {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .category-study { background: rgba(33,150,243,0.2); color: #2196f3; }
        .category-exercise { background: rgba(76,175,80,0.2); color: #4caf50; }
        .category-personal { background: rgba(244,67,54,0.2); color: #f44336; }

        .task-time {
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 5px;
        }

        .btn-complete { background: #4caf50; color: white; }
        .btn-edit { background: #ff9800; color: white; }
        .btn-delete { background: #f44336; color: white; }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            color: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: all 0.4s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: modalFadeIn 0.3s ease-out;
        }

        .modal-content {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            transform: scale(0.7);
            animation: modalSlideIn 0.4s ease-out forwards;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlideIn {
            to { transform: scale(1); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .cancel-btn {
            background: #f0f0f0;
            color: #666;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .save-btn {
            background: var(--primary-gradient);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.8);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; }
            .current-time { font-size: 2rem; }
            .dashboard { padding: 25px 20px; }
            .task-categories { flex-direction: column; align-items: center; }
            .stats-grid { grid-template-columns: 1fr; }
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-clock"></i> Student Time Manager</h1>
            <p>Master your daily schedule with style ✨</p>
        </header>

        <div class="dashboard">
            <div class="date-time-card">
                <div class="current-time" id="currentTime">--:--</div>
                <div class="current-date" id="currentDate">Loading...</div>
            </div>

            <button class="add-task-btn" id="addTaskBtn">
                <i class="fas fa-plus"></i> Add New Task
            </button>

            <div class="task-categories">
                <div class="category active" data-category="all">
                    <i class="fas fa-list"></i> All <span class="count" id="allCount">0</span>
                </div>
                <div class="category" data-category="study">
                    <i class="fas fa-book"></i> Study <span class="count" id="studyCount">0</span>
                </div>
                <div class="category" data-category="exercise">
                    <i class="fas fa-dumbbell"></i> Exercise <span class="count" id="exerciseCount">0</span>
                </div>
                <div class="category" data-category="personal">
                    <i class="fas fa-heart"></i> Personal <span class="count" id="personalCount">0</span>
                </div>
            </div>

            <div class="tasks-list" id="tasksList">
                <div class="empty-state">
                    <i class="fas fa-tasks"></i>
                    <h3>Welcome! 👋</h3>
                    <p>Add your first task to get started on your perfect schedule</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="productivityScore">0%</div>
                    <div class="stat-label">Productivity</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h3 id="modalTitle">Add New Task</h3>
                <button class="close-btn" onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Task Name</label>
                    <input type="text" id="taskName" placeholder="e.g. Math homework" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-clock"></i> Duration (minutes)</label>
                    <input type="number" id="taskDuration" min="5" max="300" value="60" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar-day"></i> Date</label>
                    <input type="date" id="taskDate">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-layer-group"></i> Category</label>
                    <select id="taskCategory" required>
                        <option value="study">📚 Study</option>
                        <option value="exercise">💪 Exercise</option>
                        <option value="personal">❤️ Personal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="taskCompleted"> Mark as completed
                    </label>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="save-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        class StudentTimeManager {
            constructor() {
                this.tasks = JSON.parse(localStorage.getItem('studentTasks')) || [];
                this.currentFilter = 'all';
                this.currentEditingId = null;
                this.init();
            }

            init() {
                this.updateTime();
                this.renderTasks();
                this.bindEvents();
                setInterval(() => this.updateTime(), 1000);
            }

            updateTime() {
                const now = new Date();
                document.getElementById('currentTime').textContent = 
                    now.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: true});
                document.getElementById('currentDate').textContent = 
                    now.toLocaleDateString('en-US', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
            }

            bindEvents() {
                document.getElementById('addTaskBtn').onclick = () => this.openModal();
                document.getElementById('taskForm').onsubmit = (e) => {
                    e.preventDefault();
                    this.saveTask();
                };
                document.querySelectorAll('.category').forEach(cat => {
                    cat.onclick = (e) => this.filterTasks(e.currentTarget.dataset.category);
                });
            }

            openModal(task = null) {
                const modal = document.getElementById('taskModal');
                const form = document.getElementById('taskForm');
                
                if (task) {
                    this.currentEditingId = task.id;
                    document.getElementById('modalTitle').textContent = 'Edit Task';
                    document.getElementById('taskName').value = task.name;
                    document.getElementById('taskDuration').value = task.duration;
                    document.getElementById('taskDate').value = task.date;
                    document.getElementById('taskCategory').value = task.category;
                    document.getElementById('taskCompleted').checked = task.completed;
                } else {
                    this.currentEditingId = null;
                    document.getElementById('modalTitle').textContent = 'Add New Task';
                    form.reset();
                    document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];
                }
                
                modal.classList.add('active');
            }

            closeModal() {
                document.getElementById('taskModal').classList.remove('active');
            }

            saveTask() {
                const task = {
                    id: this.currentEditingId || Date.now().toString(),
                    name: document.getElementById('taskName').value,
                    duration: parseInt(document.getElementById('taskDuration').value),
                    date: document.getElementById('taskDate').value,
                    category: document.getElementById('taskCategory').value,
                    completed: document.getElementById('taskCompleted').checked
                };

                if (this.currentEditingId) {
                    const index = this.tasks.findIndex(t => t.id === this.currentEditingId);
                    this.tasks[index] = task;
                } else {
                    this.tasks.unshift(task);
                    this.showConfetti();
                }

                localStorage.setItem('studentTasks', JSON.stringify(this.tasks));
                this.renderTasks();
                this.updateStats();
                this.closeModal();
            }

            deleteTask(id) {
                if (confirm('Delete this task?')) {
                    this.tasks = this.tasks.filter(t => t.id !== id);
                    localStorage.setItem('studentTasks', JSON.stringify(this.tasks));
                    this.renderTasks();
                    this.updateStats();
                }
            }

            toggleComplete(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    if (task.completed) this.showConfetti();
                    localStorage.setItem('studentTasks', JSON.stringify(this.tasks));
                    this.renderTasks();
                    this.updateStats();
                }
            }

            filterTasks(category) {
                document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                document.querySelector(`[data-category="${category}"]`).classList.add('active');
                this.currentFilter = category;
                this.renderTasks();
            }

            renderTasks() {
                const container = document.getElementById('tasksList');
                let tasks = this.tasks;

                if (this.currentFilter !== 'all') {
                    tasks = tasks.filter(t => t.category === this.currentFilter);
                }

                if (tasks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-${this.currentFilter === 'all' ? 'tasks' : this.currentFilter}"></i>
                            <h3>No ${this.currentFilter} tasks yet</h3>
                            <p>Add your first ${this.currentFilter} task!</p>
                            <button class="add-task-btn" onclick="app.openModal()">+ Add Task</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = tasks.map(task => `
